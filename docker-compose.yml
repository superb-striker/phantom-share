services:
  postgres:
    image: postgres:16-alpine
    container_name: phantom-share-postgres
    environment:
      POSTGRES_DB: phantom 
      POSTGRES_USER: ${POSTGRES_USERNAME} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d phantom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phantom-share-net 
  
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: phantom-share-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME} 
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: 
      - phantom-share-net
  
  redis:
    image: redis:8.4-alpine 
    container_name: phantom-share-redis 
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phantom-share-net

  phantom-share:
    build: .
    container_name: phantom-share-app 
    env_file:
      - .env 
    environment:
      # These override whatever is in .env, so the app talks to the other containers by their service name instead of localhost
      DATABASE_URL: "host=postgres dbname=phantom user=${POSTGRES_USERNAME} password=${POSTGRES_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phantom-share-net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  phantom-share-net:
    driver: bridge
