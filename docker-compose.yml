---
services:
  postgres:
    image: postgres:16-alpine
    container_name: phantom-share-postgres
    environment:
      POSTGRES_DB: phantom
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d phantom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phantom-share-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: phantom-share-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phantom-share-net

  redis:
    image: redis:8.4-alpine
    container_name: phantom-share-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phantom-share-net

  migrate:
    image: ghcr.io/amacneil/dbmate:2.35.1
    environment:
      DATABASE_URL: "postgres://postgres:5432/phantom?sslmode=disable"
      PGUSER: ${POSTGRES_USERNAME}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./database:/db:ro
    command: ["--wait", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phantom-share-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phantom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phantom-local-development}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - phantom-share-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/phantom-share
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phantom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phantom-local-development}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - phantom-share-net

  clamav:
    image: clamav/clamav:1.4.3
    environment:
      CLAMD_CONF_StreamMaxLength: 64M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - phantom-share-net

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks:
      - phantom-share-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - phantom-share-net

  phantom-share:
    build: .
    container_name: phantom-share-app
    env_file:
      - .env
    environment:
      # These override whatever is in .env, so the app talks to the other containers by their service name instead of localhost
      DATABASE_URL: "host=postgres dbname=phantom user=${POSTGRES_USERNAME} password=${POSTGRES_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-phantom}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-phantom-local-development}
      S3_BUCKET: "phantom-share"
      CLAMAV_HOST: "clamav"
      GEOIP_DATABASE_PATH: "/geoip/GeoLite2-Country.mmdb"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-[]}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-phantom-share}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
    ports:
      - "8000:8000"
    volumes:
      - ./data/GeoLite2-Country.mmdb:/geoip/GeoLite2-Country.mmdb:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - phantom-share-net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  phantom-share-net:
    driver: bridge
